name: Daily Ukraine–Russia War Analyst Brief

on:
  schedule:
    # 05:00 AM Eastern Time = 10:00 UTC (accounts for EDT; adjust to 10:00 UTC for EST Nov-Mar)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      recipient_email:
        description: 'Override recipient email (default: ericjsanchez23@gmail.com)'
        required: false
        default: 'ericjsanchez23@gmail.com'

jobs:
  generate-and-email-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install anthropic requests python-dateutil

      - name: Generate Daily Brief via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email || 'ericjsanchez23@gmail.com' }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python .github/scripts/generate_daily_brief.py

      - name: Upload brief as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukraine-war-brief-${{ github.run_id }}
          path: brief_output/
          retention-days: 30
