name: Daily Ukraine-Russia War Analyst Brief

on:
  schedule:
    # 5:00 AM Eastern Time = 10:00 UTC (EST) / 09:00 UTC (EDT)
    # Using 10:00 UTC to cover EST; adjust to 09:00 UTC during daylight saving time
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/kind-brahmagupta-sldyx6
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic==0.40.0 markdown2 weasyprint requests

      - name: Generate daily brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: |
          python scripts/generate_brief.py

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ericjsanchez23@gmail.com
        run: |
          python scripts/send_brief_email.py

      - name: Commit and push report
        run: |
          git config user.name "Ukraine Brief Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "Add daily Ukraine-Russia War Analyst Brief $(date +%Y-%m-%d)"
          git push origin claude/kind-brahmagupta-sldyx6
