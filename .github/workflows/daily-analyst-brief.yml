name: Daily Ukraine-Russia War Analyst Brief

on:
  # 5:00 AM Eastern Time = 09:00 UTC (EDT, Mar-Nov) / 10:00 UTC (EST, Nov-Mar)
  # Using 09:00 UTC for EDT (summer); adjust to 10:00 UTC in winter if needed.
  schedule:
    - cron: '0 9 * * *'

  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:

jobs:
  generate-and-send:
    name: Generate and Email Analyst Brief
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and send analyst brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python scripts/generate_brief.py

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.error('Daily analyst brief generation failed. Check the run log for details.');
