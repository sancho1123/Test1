name: Daily Ukraine–Russia War Analyst Brief

on:
  schedule:
    # 5:00 AM Eastern Time = 10:00 UTC (standard time) / 09:00 UTC (daylight saving)
    # Using 09:00 UTC to target 5 AM ET during daylight saving time (Mar–Nov)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email upon completion'
        required: false
        default: 'true'
        type: boolean

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic==0.25.0 requests python-dotenv

      - name: Generate daily analyst brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REPORT_DATE: ${{ github.event.schedule && '' || github.run_id }}
        run: |
          python scripts/generate_brief.py

      - name: Send email
        if: ${{ github.event_name == 'schedule' || inputs.send_email == 'true' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ericjsanchez23@gmail.com
        run: |
          python scripts/send_email.py

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ukraine-brief-${{ env.REPORT_DATE_STR }}
          path: reports/latest_brief.md
          retention-days: 90

      - name: Commit report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Add daily brief $(date -u +%Y-%m-%d)"
          git push origin HEAD
