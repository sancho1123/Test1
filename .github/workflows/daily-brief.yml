name: Daily Ukraine-Russia War Analyst Brief

on:
  schedule:
    # 5:00 AM Eastern Time = 10:00 UTC (accounts for EDT; adjust to 11:00 UTC for EST in winter)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate daily analyst brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: |
          python scripts/generate_brief.py

      - name: Commit report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(python -c "from datetime import date; print(date.today())")
          REPORT_FILE="reports/${DATE}_Ukraine-Russia_War_Daily_Analyst_Brief_OUSW-PB.md"
          if [ -f "$REPORT_FILE" ]; then
            git add "$REPORT_FILE"
            git diff --cached --quiet || git commit -m "Add daily analyst brief for ${DATE}"
            git push
          else
            echo "Report file not found; skipping commit."
          fi
