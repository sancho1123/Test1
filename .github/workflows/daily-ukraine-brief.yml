name: Daily Ukraine–Russia War Analyst Brief

on:
  schedule:
    # 5:00 AM ET ≈ 09:00 UTC (EDT, Mar–Nov) / 10:00 UTC (EST, Nov–Mar)
    # 09:30 UTC targets ~5 AM EDT / ~4:30 AM EST — close enough year-round
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Override report date (YYYY-MM-DD); leave blank for today'
        required: false
        default: ''

jobs:
  generate-brief:
    name: Generate Daily Analyst Brief
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate Daily Brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDER_EMAIL:      ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL:   ericjsanchez23@gmail.com
          OUTPUT_DIR:        reports
          OVERRIDE_DATE:     ${{ github.event.inputs.report_date }}
        run: python scripts/ukraine_brief.py

      - name: Upload report artifact (retained 90 days)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ukraine-russia-brief-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Commit report to repository
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "OUSW P/B Analyst Brief Bot"
          git add reports/
          git diff --quiet && git diff --staged --quiet && echo "[Brief] No new files to commit." && exit 0
          git commit -m "Daily Ukraine–Russia War Brief — $(TZ='America/New_York' date +%Y-%m-%d)"
          git push
