name: Daily Ukraine–Russia War Analyst Brief

on:
  schedule:
    # 5:00 AM Eastern Time = 10:00 AM UTC (EST) / 09:00 AM UTC (EDT)
    # Using 10:00 UTC to cover EST; adjust to 09:00 during EDT (summer)
    - cron: '0 10 * * *'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  generate-and-send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and send daily brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python scripts/generate_brief.py
