name: Daily Ukraine-Russia War Analyst Brief

on:
  # Run every day at 05:00 AM Eastern Time (09:00 UTC, or 10:00 UTC during EDT)
  # Adjust cron for EDT (UTC-4) vs EST (UTC-5):
  #   05:00 ET (EDT, Mar–Nov) = 09:00 UTC
  #   05:00 ET (EST, Nov–Mar) = 10:00 UTC
  # Using 09:00 UTC covers EDT; update to 10:00 UTC in winter if needed.
  schedule:
    - cron: "0 9 * * *"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  generate-and-send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and send analyst brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: python scripts/ukraine_brief.py

      - name: Upload report artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brief-failure-log-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
